# CipherChat releases. Gate property, same rule as CI: the security
# property suite runs BEFORE the release is created. A red suite
# means no release. Tags containing a hyphen (rc, beta) are marked
# prerelease automatically.

name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write  # needed to push to GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # Gate: a red suite means no release.
      - name: Property suite
        run: bun run test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: |
            ghcr.io/izumitempest/cipherchat-web:${{ env.VERSION }}
            ghcr.io/izumitempest/cipherchat-web:latest
          platforms: linux/amd64

      - name: Build and push migrate image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.web
          target: migrate
          push: true
          tags: |
            ghcr.io/izumitempest/cipherchat-web-migrate:${{ env.VERSION }}
            ghcr.io/izumitempest/cipherchat-web-migrate:latest
          platforms: linux/amd64

      - name: Build and push relay image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.relay
          push: true
          tags: |
            ghcr.io/izumitempest/cipherchat-relay:${{ env.VERSION }}
            ghcr.io/izumitempest/cipherchat-relay:latest
          platforms: linux/amd64

      - name: Create deploy bundle ZIP
        run: |
          cd deploy/bundle
          zip -r cipherchat-deploy-${{ env.VERSION }}.zip .
          mv cipherchat-deploy-${{ env.VERSION }}.zip ../..
          cd ../..

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARGS=(--title "CipherChat ${TAG}" --notes-file RELEASE_NOTES.md)
          if [[ "$TAG" == *-* ]]; then ARGS+=(--prerelease); fi
          gh release create "$TAG" "${ARGS[@]}"

      - name: Upload deploy bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" "cipherchat-deploy-${VERSION}.zip"
