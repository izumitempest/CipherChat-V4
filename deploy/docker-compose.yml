# CipherChat production — one plain VPS, TLS from a stock compose file.
#
#   cp .env.example .env      # set RELAY_INTERNAL_TOKEN, CADDY_SITE
#   docker compose up -d
#   → https://<CADDY_SITE>
#
# `docker compose down -v` also removes the database volume — that is
# the self-host story's off-switch. Burn first if you mean it.

name: cipherchat

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # Compile-time: where the browser finds the relay.
        NEXT_PUBLIC_RELAY_URL: ${NEXT_PUBLIC_RELAY_URL:-/relay/}
    environment:
      DATABASE_URL: file:/app/db/custom.db
      # Shared secret with the relay's internal presence endpoint.
      RELAY_INTERNAL_TOKEN: ${RELAY_INTERNAL_TOKEN:?set RELAY_INTERNAL_TOKEN in deploy/.env}
      # The API tier asks the relay container (not localhost) for presence.
      RELAY_PRESENCE_URL: http://relay:3004
      # Public origin — resolves OG/social image URLs.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    volumes:
      - db-data:/app/db
    restart: unless-stopped
    depends_on:
      - relay

  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.relay
    environment:
      RELAY_INTERNAL_TOKEN: ${RELAY_INTERNAL_TOKEN:?set RELAY_INTERNAL_TOKEN in deploy/.env}
    restart: unless-stopped
    expose:
      - "3003" # socket.io relay (only Caddy reaches it)
      - "3004" # internal presence — only the web service should ask

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      # localhost → internal CA (browser warning; testing).
      # chat.example.com → automatic Let's Encrypt.
      CADDY_SITE: ${CADDY_SITE:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - web
      - relay

volumes:
  db-data:
  caddy-data:
  caddy-config:
