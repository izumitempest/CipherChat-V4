# CipherChat production: one plain VPS, TLS from a stock compose file.
#
#   cp .env.example .env      # set RELAY_INTERNAL_TOKEN, CADDY_SITE
#   docker compose up -d
#   → https://<CADDY_SITE>
#
# `docker compose down -v` also removes the database volume. That is
# the self-host story's off-switch. Burn first if you mean it.

name: cipherchat

services:
  # The migration step. Runs once per deploy, applies the pending
  # migrations, backs the database up first, and exits. The web
  # container waits for it.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      target: migrate
    environment:
      DATABASE_URL: file:/app/db/custom.db
    volumes:
      - db-data:/app/db
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # Compile-time: where the browser finds the relay.
        NEXT_PUBLIC_RELAY_URL: ${NEXT_PUBLIC_RELAY_URL:-/relay/}
    environment:
      DATABASE_URL: file:/app/db/custom.db
      # Shared secret with the relay's internal presence endpoint.
      RELAY_INTERNAL_TOKEN: ${RELAY_INTERNAL_TOKEN:?set RELAY_INTERNAL_TOKEN in deploy/.env}
      # The API tier asks the relay container (not localhost) for presence.
      RELAY_PRESENCE_URL: http://relay:3004
      # Public origin. Resolves OG/social image URLs.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    volumes:
      - db-data:/app/db
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      relay:

  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.relay
    environment:
      RELAY_INTERNAL_TOKEN: ${RELAY_INTERNAL_TOKEN:?set RELAY_INTERNAL_TOKEN in deploy/.env}
      # The relay answers only the app's origin. With nothing set the
      # relay takes the local app and the site below. Set it to a
      # comma separated list to pin it exactly.
      RELAY_ALLOWED_ORIGINS: ${RELAY_ALLOWED_ORIGINS:-}
      # So the relay can name the deployed site in its default list.
      CADDY_SITE: ${CADDY_SITE:-localhost}
    restart: unless-stopped
    expose:
      - "3003" # socket.io relay (only Caddy reaches it)
      - "3004" # internal presence; only the web service should ask

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      # localhost → internal CA (browser warning; testing).
      # chat.example.com → automatic Let's Encrypt.
      CADDY_SITE: ${CADDY_SITE:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - web
      - relay

volumes:
  db-data:
  caddy-data:
  caddy-config:
