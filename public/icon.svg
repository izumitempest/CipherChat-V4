<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- CipherChat — the Split Seal on a paper tile.
       A wax seal cracked along one clean diagonal; the two halves
       keep the slight rotation and the hair of translation they took
       when the wax broke. The ember diamond in the fracture is the
       heat inside. Bezier contour (joint radii wobble 33.3/35.1
       against a nominal 34) — hand-pressed, not compass-drawn. -->
  <rect width="512" height="512" rx="96" fill="#F4F1EB"/>
  <g transform="translate(49.6 49.6) scale(4.3)">
    <!-- half A (upper-left): rim shard + its share of the disc -->
    <g transform="translate(-0.4 -0.21) rotate(-1.2 48 48)">
      <path d="M 61.83 16.94 C 45.77 9.79, 26.25 16.63, 18.07 33.4 C 9.81 50.33, 16.67 69.85, 32.04 78.02"
            fill="none" stroke="#3A4F41" stroke-width="7.5"/>
      <path d="M 53.29 36.12 C 46.89 33.28, 39.39 36.01, 36.32 42.3 C 33.25 48.6, 35.71 56.19, 41.9 59.48 Z"
            fill="#3A4F41"/>
    </g>
    <!-- half B (lower-right) -->
    <g transform="translate(0.44 0.23) rotate(1.4 48 48)">
      <path d="M 34.17 79.06 C 50.97 86.54, 70.6 80.27, 78.99 64.48 C 87.21 49.02, 82.07 29.2, 66.02 19.17"
            fill="none" stroke="#3A4F41" stroke-width="7.5"/>
      <path d="M 42.71 59.88 C 48.95 62.65, 56.27 60.13, 59.48 54.1 C 62.68 48.07, 60.68 40.59, 54.89 36.98 Z"
            fill="#3A4F41"/>
    </g>
    <!-- the ember in the fracture -->
    <path d="M 57.15 30.78 L 54.36 33.26 L 53.87 36.96 L 56.66 34.48 Z" fill="#E8A87C"/>
  </g>
</svg>
